version: 2

sources:
  - name: raw
    description: Landed source data, loaded as-is by scripts/extract_load.py.
    schema: raw
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 72, period: hour}
    tables:
      - name: crm_accounts
        description: CRM account export (CSV).
      - name: billing_subscriptions
        description: Subscriptions from the billing API (JSON, flattened).
      - name: billing_invoices
        description: Monthly invoices from the billing API (JSON, flattened).
      - name: product_events
        description: Product-analytics event stream (one row per user event).
      - name: product_features
        description: Product feature catalogue.
